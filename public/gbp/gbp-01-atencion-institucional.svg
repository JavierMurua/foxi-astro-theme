<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Atención institucional ESCUSUB</title>
  <rect width="1080" height="1080" rx="40" fill="#F8F7F6"/>
  <rect x="60" y="60" width="960" height="960" rx="32" fill="white" stroke="#E8E5E0" stroke-width="2"/>
  <!-- Icon: shield + cross -->
  <g transform="translate(540, 360)">
    <circle cx="0" cy="0" r="110" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
    <path d="M0 -65 L55 -40 L55 30 C55 65 25 88 0 100 C-25 88 -55 65 -55 30 L-55 -40 Z" fill="none" stroke="#9CA3AF" stroke-width="6" stroke-linejoin="round"/>
    <g transform="translate(0, 8)">
      <rect x="-36" y="-10" width="72" height="20" rx="4" fill="#FB7185"/>
      <rect x="-10" y="-36" width="20" height="72" rx="4" fill="#FB7185"/>
    </g>
  </g>
  <!-- Text -->
  <text x="540" y="560" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#9CA3AF">INFORMACIÓN IMPORTANTE</text>
  <text x="540" y="620" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#1F2937">Atención a</text>
  <text x="540" y="680" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#1F2937">Gendarmería</text>
  <text x="540" y="740" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#6B7280">Únicamente en</text>
  <text x="540" y="780" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#374151">ESCUSUB · Área de Sanidad</text>
  <line x1="440" y1="810" x2="640" y2="810" stroke="#FDE68A" stroke-width="6" stroke-linecap="round"/>
  <text x="540" y="860" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#9CA3AF">No se realiza en consultorio privado</text>
  <text x="540" y="890" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#9CA3AF">presencial u online</text>
  <!-- Footer badge -->
  <g transform="translate(540, 960)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#F3F4F6"/>
    <text x="0" y="7" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#6B7280">LIC. PRISCILA GIMÉNEZ · PSICÓLOGA</text>
